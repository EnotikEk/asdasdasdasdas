[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-retouch-pro"
version = "1.0.0"
description = "Professional photo retouching application with ML-powered restoration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Photo Retouch Team", email = "team@photoretouch.local"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Editors",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "Flask>=3.1,<4",
    "rembg[cpu]==2.0.67",
    "mediapipe==0.10.32",
    "gunicorn>=23,<28; sys_platform != 'win32'",
    "Pillow>=11.0.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.10,<5",
    "fonttools>=4.40.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "gfpgan>=1.3.8",
    "realesrgan>=0.3.0",
    "basicsr>=1.4.2",
]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
photo-retouch = "photo_retouch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["photo_retouch*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
photo_retouch = ["templates/*.html", "static/*.css", "static/*.js", "static/*.png"]

[tool.pytest.ini_options]
qt_api = "pyqt6"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4", "ANN", "ARG", "PTH", "SIM", "T20", "TID", "TRY"]
ignore = ["ANN101", "ANN102", "ARG001", "ARG002", "TRY003", "PTH123"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
